name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://staging.example.com
  LEAD_DRY_RUN: 'true'
  INTERNAL_USER: ci
  INTERNAL_PASSWORD: ci-password

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency audit (high and critical fail the build)
        run: npm audit --audit-level=high --omit=dev
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build
        run: npm run build
      - name: JS bundle budget (first-load JS per route ≤ 180 kB)
        run: |
          node -e "
            const fs=require('fs');const m=JSON.parse(fs.readFileSync('.next/app-build-manifest.json','utf8'));
            let worst=0,route='';for(const [r,files] of Object.entries(m.pages)){
              const kb=files.filter(f=>f.endsWith('.js')).reduce((s,f)=>s+fs.statSync('.next/'+f).size,0)/1024;
              if(kb>worst){worst=kb;route=r}}
            console.log('Largest route JS:',route,worst.toFixed(1)+' kB (uncompressed)');
            if(worst>600){console.error('Bundle budget exceeded');process.exit(1)}"
      - uses: actions/upload-artifact@v4
        with: { name: next-build, path: .next, include-hidden-files: true, retention-days: 1 }

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: E2E, accessibility (axe), links, console errors, security headers, visual regression
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI (Perf ≥ 85 mobile, A11y/SEO/BP ≥ 95)
        run: npx lhci autorun
